[theme]
base = "dark"
primaryColor = "#65E7FF"
backgroundColor = "#050914"
secondaryBackgroundColor = "#0D162B"
textColor = "#F7F9FF"
font = "sans serif"

[server]
headless = true
maxUploadSize = 25
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"
